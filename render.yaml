services:
  - type: web
    name: manga-crm
    runtime: python
    plan: free
    rootDir: .
    buildCommand: bash ./build.sh
    startCommand: cd backend && gunicorn manga_crm.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: manga-crm-db
          property: connectionString
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "https://manga-crm.onrender.com"
    healthCheckPath: /admin/login/
    autoDeploy: true

databases:
  - name: manga-crm-db
    plan: free
    databaseName: manga_crm
    user: manga_crm
